<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({antialias: true}); r.setSize(900, 600); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x303236);
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(35, 1.5, 0.05, 100);
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(q.get('f'));
s.add(g.scene);
const names = []; g.scene.traverse(o => { if (o.isMesh) names.push(o.name); });
window.names = names;
const v = (q.get('v') || '0,0.4,-6').split(',').map(Number);
cam.position.set(...v); cam.lookAt(0, 0.35, 0);
r.render(s, cam); window.done = true;
</script></body></html>
